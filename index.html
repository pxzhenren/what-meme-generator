<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Random Meme Generator</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    #meme {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    button {
      padding: 14px 24px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: white;
      color: black;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <h1>🎲 Random Meme Generator</h1>

  <img id="meme" src="" alt="Random Meme" />

  <br />

  <button onclick="nextMeme()">
    Next Meme
  </button>

  <script>
    const memes = [
      "memes/meme1.png",
      "memes/meme2.png",
      "memes/meme3.png",
      "memes/meme4.png",
      "memes/meme5.png",
      "memes/meme6.png",
      "memes/meme7.png",
      "memes/meme8.png",
      "memes/meme9.png",
      "memes/meme10.png",
      "memes/meme11.png",
      "memes/meme12.png",
      "memes/meme13.png",
      "memes/meme14.png",
      "memes/meme33.png",
      "memes/memewa.png",
      "memes/memewawa.png",
      "memes/memexianzhe.png"
    ];

    let shuffledMemes = [];
    let currentIndex = 0;

    function shuffleArray(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function nextMeme() {

      // reshuffle after all memes shown
      if (currentIndex >= shuffledMemes.length) {
        shuffledMemes = shuffleArray(memes);
        currentIndex = 0;
      }

      document.getElementById("meme").src =
        shuffledMemes[currentIndex];

      currentIndex++;
    }

    // initial shuffle
    shuffledMemes = shuffleArray(memes);

    // show first meme automatically
    nextMeme();
  </script>

</body>
</html>
